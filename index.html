<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>200+ Recetas para personas con diabetes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
    display: flex;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 0 24px 60px;
    text-align: center;
  }
  .page-label {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 13px;
    color: #777;
    letter-spacing: .5px;
  }
  .warning {
    position: relative;
    margin-top: 44px;
    padding-right: 10px;
  }
  .espera {
    display: inline-block;
    background: #e60000;
    color: #fff;
    font-weight: 800;
    font-size: 24px;
    padding: 8px 14px;
    border-radius: 8px;
    transform: translateX(-34px);
  }
  .instrucciones {
    display: block;
    width: fit-content;
    margin: 8px auto 0;
    transform: translateX(-34px);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
  }
  .instrucciones span {
    background: #ffe600;
    padding: 2px 8px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    border-radius: 6px;
  }
  .instrucciones .grande { font-size: 15px; font-weight: 800; }
  .arrow {
    position: absolute;
    top: -18px;
    right: -14px;
    width: 190px;
    height: 110px;
    pointer-events: none;
  }
  .texto {
    margin-top: 62px;
    font-size: 13px;
    line-height: 1.6;
    padding: 0 12px;
  }
  .libro {
    display: block;
    width: 150px;
    height: auto;
    margin: 18px auto 0;
  }
  .btn {
    display: block;
    margin: 20px auto 0;
    width: 100%;
    max-width: 330px;
    background: #ff0000;
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    text-decoration: none;
    padding: 16px 0;
    border-radius: 999px;
    border: 1px solid #b00000;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="page">
    <span class="page-label">Página 1</span>

    <section class="warning">
      <svg class="arrow" viewBox="0 0 190 110" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#5aa9f0"/>
            <stop offset="1" stop-color="#2f6fd0"/>
          </linearGradient>
        </defs>
        <path d="M6 100 C 50 105, 125 85, 150 38 L 136 36 L 165 6 L 188 40 L 172 38 C 150 92, 70 118, 6 108 Z" fill="url(#g)"/>
      </svg>

      <div class="espera">¡ESPERA!</div>
      <p class="instrucciones">
        <span>Toca los 3 puntos y selecciona</span><br>
        <span class="grande">“ABRIR EN EL NAVEGADOR”.</span><br>
        <span>Después, haz clic en el</span><br>
        <span>botón de abajo.</span>
      </p>
    </section>

    <p class="texto">
      Si estás listo para dejar de vivir con dudas sobre qué comer y comenzar a disfrutar recetas deliciosas que te ayuden a cuidar tu alimentación, Haz clic en “VER MÁS”.
    </p>

    <img class="libro"
         src="https://digitalstor.my.canva.site/recetas-sa/_assets/media/0215c041ca3887c28dd3ca1d40431b9c.jpg"
         alt="200+ Recetas para personas con diabetes">

    <a class="btn" href="https://go.hotmart.com/P108179470T">Ver más</a>
  </main>
</body>
</html>
