<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>200+ Recetas para personas con diabetes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: Roboto, Arial, Helvetica, sans-serif;
    color: #000;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 0 22px 70px;
    text-align: center;
  }
  .page-label {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 14px;
    color: #666;
    letter-spacing: .5px;
  }
  .warning { position: relative; margin-top: 52px; }
  .espera {
    display: inline-block;
    background: #e60000;
    color: #fff;
    font-family: "Archivo Black", "Arial Black", Arial, sans-serif;
    font-size: 30px;
    line-height: 1;
    padding: 12px 18px;
    border-radius: 10px;
    transform: translateX(-30px);
  }
  .instrucciones {
    display: block;
    width: fit-content;
    margin: 10px auto 0;
    transform: translateX(-30px);
    font-family: "Archivo Black", "Arial Black", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    text-align: center;
    color: #000;
  }
  .instrucciones span {
    background: #ffe600;
    padding: 2px 9px;
    border-radius: 7px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .instrucciones .grande { font-size: 18px; }
  .arrow {
    position: absolute;
    top: -22px;
    right: -10px;
    width: 175px;
    height: 105px;
    pointer-events: none;
  }
  .texto {
    margin-top: 70px;
    font-size: 17px;
    line-height: 1.55;
    font-weight: 500;
    color: #000;
    padding: 0 6px;
  }
  .texto b { font-weight: 700; }
  .libro {
    display: block;
    width: 175px;
    height: auto;
    margin: 22px auto 0;
  }
  .btn {
    display: block;
    margin: 24px auto 0;
    width: 100%;
    max-width: 340px;
    background: #ff0000;
    color: #fff;
    font-family: "Archivo Black", "Arial Black", Arial, sans-serif;
    font-size: 28px;
    text-decoration: none;
    padding: 18px 0;
    border-radius: 999px;
    border: 1px solid #b00000;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="page">
    <span class="page-label">Página 1</span>

    <section class="warning">
      <svg class="arrow" viewBox="0 0 190 110" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#5aa9f0"/>
            <stop offset="1" stop-color="#2f6fd0"/>
          </linearGradient>
        </defs>
        <path d="M6 100 C 50 105, 125 85, 150 38 L 136 36 L 165 6 L 188 40 L 172 38 C 150 92, 70 118, 6 108 Z" fill="url(#g)"/>
      </svg>

      <div class="espera">¡ESPERA!</div>
      <p class="instrucciones">
        <span>Toca los 3 puntos y selecciona</span><br>
        <span class="grande">“ABRIR EN EL NAVEGADOR”.</span><br>
        <span>Después, haz clic en el</span><br>
        <span>botón de abajo.</span>
      </p>
    </section>

    <p class="texto">
      Si estás listo para dejar de vivir con dudas sobre qué comer y comenzar a disfrutar recetas deliciosas que te ayuden a cuidar tu alimentación, Haz clic en “VER MÁS”.
    </p>

    <img class="libro"
         src="https://digitalstor.my.canva.site/recetas-sa/_assets/media/0215c041ca3887c28dd3ca1d40431b9c.jpg"
         alt="200+ Recetas para personas con diabetes">

    <a class="btn" href="https://go.hotmart.com/P108179470T">Ver más</a>
  </main>
</body>
</html>
